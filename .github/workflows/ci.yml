name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check dqdoctor/ tests/

      - name: Run tests
        run: pytest tests/ -v --cov=dqdoctor --cov-report=xml

      - name: End-to-end CLI (demo -> check -> rules-init -> check -> export)
        shell: bash
        run: |
          dqdoctor --version
          dqdoctor doctor || true
          dqdoctor demo --dirty --output smoke.duckdb
          dqdoctor tables --db smoke.duckdb
          dqdoctor rules-init --db smoke.duckdb --all-tables --out c.yml
          set +e
          dqdoctor check --db smoke.duckdb --all-tables --rules c.yml --out r.html --json r.json --ci
          gate=$?
          set -e
          test "$gate" = "1" || (echo "expected gate exit 1, got $gate"; exit 1)
          set +e
          dqdoctor check --db smoke.duckdb --all-tables --rules missing.yml > /dev/null 2>&1
          missing=$?
          set -e
          test "$missing" = "2" || (echo "expected config error exit 2, got $missing"; exit 1)
          dqdoctor export --rules c.yml --format dbt --out schema.yml
          dqdoctor export --rules c.yml --format gx --out suite.json
          dqdoctor export --rules c.yml --format soda --out checks.yml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: SQL backends (PostgreSQL + MySQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dqtest
          POSTGRES_PASSWORD: dqtest
          POSTGRES_DB: dqtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: dqtest
          MYSQL_DATABASE: dqtest
          MYSQL_USER: dqtest
          MYSQL_PASSWORD: dqtest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sql]"

      - name: Run cross-backend tests
        env:
          DQTEST_PG: postgresql://dqtest:dqtest@127.0.0.1:5432/dqtest
          DQTEST_MYSQL: mysql://dqtest:dqtest@127.0.0.1:3306/dqtest
        run: pytest tests/test_backends.py -v

  build:
    name: build wheel + sdist and install from wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/dqdoctor --version
          cd /tmp && /tmp/clean/bin/dqdoctor demo --dirty --output clean.duckdb
          /tmp/clean/bin/dqdoctor rules-init --db clean.duckdb --all-tables --out c.yml
          /tmp/clean/bin/dqdoctor export --rules c.yml --format dbt --out s.yml
