[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dq-doctor"
version = "1.0.5"
description = "One command to profile tables, fix a data quality contract, and gate new data batches."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "pugyy" }]
keywords = [
    "data-quality",
    "data-profiling",
    "cli",
    "duckdb",
    "validation",
    "dbt",
    "great-expectations",
    "soda",
    "pii-detection",
    "referential-integrity",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/pugyy/dq-doctor"
Repository = "https://github.com/pugyy/dq-doctor"
Issues = "https://github.com/pugyy/dq-doctor/issues"
Changelog = "https://github.com/pugyy/dq-doctor/blob/main/CHANGELOG.md"

[project.scripts]
dqdoctor = "dqdoctor.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
sql = [
    "sqlalchemy>=2.0",
    # SQLAlchemy 2.1 resolves a bare postgresql:// URL to the psycopg3
    # driver; shipping only psycopg2 made `pip install dq-doctor[sql]` fail
    # with ModuleNotFoundError on first connect.
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
]
llm = [
    "openai>=1.40",
]
dashboard = [
    "flask>=3.0",
]
mcp = [
    "mcp>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["dqdoctor"]
artifacts = [
    "dqdoctor/templates/*.html",
    "dqdoctor/data/*.sql",
]

[tool.hatch.build.targets.sdist]
artifacts = [
    "dqdoctor/templates/*.html",
    "dqdoctor/data/*.sql",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented API uses Option()/Argument() calls in parameter defaults.
"dqdoctor/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dqdoctor --cov-report=term-missing --cov-fail-under=75"
